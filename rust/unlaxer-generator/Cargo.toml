[package]
name = "unlaxer-generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
unlaxer-runtime = { path = "../unlaxer-runtime" }
serde = "1"
unlaxer-ubnf = { path = "../unlaxer-ubnf" }
unlaxer-codegen = { path = "../unlaxer-codegen" }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[[bin]]
name = "unlaxer"
path = "src/main.rs"

# As in unlaxer-alloc-audit, keep unsafe denied except for the small POSIX
# credentials-home adapter. Parser/runtime crates retain workspace forbid.
[lints.rust]
unsafe_code = "deny"
