name: analysis-pipeline
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analysis-pipeline:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - name: Select job temporary directory (#1045)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          MAVEN_OPTS: -Djava.io.tmpdir=${{ runner.temp }} -Dunlaxer.test.tmpdir=${{ runner.temp }} -DadditionalJOption=-J-Djava.io.tmpdir=${{ runner.temp }}
        run: |
          printf '%s\n' "TMPDIR=$TMPDIR" "TMP=$TMP" "TEMP=$TEMP" "MAVEN_OPTS=$MAVEN_OPTS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - name: Rust toolchain を既定を変更せずに準備
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
      - run: mvn -B -pl unlaxer-common -am test -Dtest=AnalysisPipelineTest -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-runtime --test pipeline
      - name: Prepare required tests (analysis-pipeline)
        run: python3 scripts/verify-optin-tests.py analysis-pipeline --prepare
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=PreprocessingConformanceTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify required tests (analysis-pipeline)
        id: verify-analysis-pipeline
        if: success()
        run: python3 scripts/verify-optin-tests.py analysis-pipeline
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.verify-analysis-pipeline.outcome != 'skipped' }}
        with:
          name: optin-analysis-pipeline
          path: |
            target/optin-evidence/analysis-pipeline/
          if-no-files-found: error
      - run: test -s unlaxer-dsl/target/rust-preprocessing.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: preprocessing-conformance
          path: unlaxer-dsl/target/rust-preprocessing.tsv
