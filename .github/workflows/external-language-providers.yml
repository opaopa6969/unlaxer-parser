name: external-language-providers
on:
  push:
    branches: [master]
  pull_request:
jobs:
  external-language-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install the locked TypeScript 5.9.3 compiler without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: unlaxer-dsl/ubnf-vscode
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=ProviderProtocolTest,ExternalProviderConformanceTest,PlaygroundCommandTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-runtime --test provider_protocol
      - uses: actions/upload-artifact@v4
        with:
          name: external-provider-observations
          path: unlaxer-dsl/target/external-provider-conformance.tsv
