name: external-language-providers
on:
  push:
    branches: [master]
  pull_request:
jobs:
  external-language-providers:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Rust toolchain を既定を変更せずに準備
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
      - name: Prepare locked dependencies for the offline LSP diagnostic probe
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Install the locked TypeScript 5.9.3 compiler without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: unlaxer-dsl/ubnf-vscode
      - name: Prepare required tests (external-language-providers)
        run: python3 scripts/verify-optin-tests.py external-language-providers --prepare
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=ProviderProtocolTest,ExternalProviderConformanceTest,LSPDiagnosticConformanceTest,SemanticDiagnosticConformanceTest,PlaygroundCommandTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify required tests (external-language-providers)
        id: verify-external-language-providers
        if: success()
        run: python3 scripts/verify-optin-tests.py external-language-providers
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.verify-external-language-providers.outcome != 'skipped' }}
        with:
          name: optin-external-language-providers
          path: |
            target/optin-evidence/external-language-providers/
          if-no-files-found: error
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-runtime --test provider_protocol
      - uses: actions/upload-artifact@v4
        with:
          name: external-provider-observations
          path: |
            unlaxer-dsl/target/external-provider-conformance.tsv
            unlaxer-dsl/target/semantic-diagnostics.tsv
