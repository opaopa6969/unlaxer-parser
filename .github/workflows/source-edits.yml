name: source-edits
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-edits:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - name: Rust toolchain を既定を変更せずに準備
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=SourceEditsTest,ProjectRenameTest,PlaygroundCommandTest -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-runtime --test source_edits
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-generator --test playground
