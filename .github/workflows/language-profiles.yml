name: language-profiles
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  language-profiles:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - name: Select job temporary directory (#1045)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          MAVEN_OPTS: -Djava.io.tmpdir=${{ runner.temp }} -Dunlaxer.test.tmpdir=${{ runner.temp }} -DadditionalJOption=-J-Djava.io.tmpdir=${{ runner.temp }}
        run: |
          printf '%s\n' "TMPDIR=$TMPDIR" "TMP=$TMP" "TEMP=$TEMP" "MAVEN_OPTS=$MAVEN_OPTS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - name: Rust toolchain を既定を変更せずに準備
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update --target wasm32-unknown-unknown
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" npm ci --ignore-scripts --no-audit --no-fund && bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" npx playwright install chromium
        working-directory: unlaxer-dsl/ubnf-vscode
      - run: python3 scripts/language-profile-corpus.py --check
      - run: python3 scripts/language-profile-packages.py --check
      - run: python3 scripts/language-profile-edit-replay.py --check
      - name: Prepare required tests (language-profiles)
        run: python3 scripts/verify-optin-tests.py language-profiles --prepare
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=LanguageProfileSelectionTest,LSPProfileInitializationTest,LSPCompileVerificationTest,LSPNonBmpOffsetTest,PackagedLanguageProfileConformanceTest,LanguageProfileConformanceTest,LanguageProfileEditReplayConformanceTest,LanguageProfileCommandTest,PlaygroundCommandTest,RustUbnfFrontendConformanceTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify required tests (language-profiles)
        id: verify-language-profiles
        if: success()
        run: python3 scripts/verify-optin-tests.py language-profiles
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.verify-language-profiles.outcome != 'skipped' }}
        with:
          name: optin-language-profiles
          path: |
            target/optin-evidence/language-profiles/
          if-no-files-found: error
      - run: test -s unlaxer-dsl/target/language-profile-edit-replay.tsv
      - run: test -s unlaxer-dsl/target/language-profile-package-entries.tsv
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-runtime --test language_profile
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-generator --test language_profiles
      - uses: actions/upload-artifact@v4
        with:
          name: language-profile-observations
          path: unlaxer-dsl/target/language-profile-*.tsv
          if-no-files-found: error
