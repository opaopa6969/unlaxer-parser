name: language-profiles
on:
  push:
    branches: [master]
  pull_request:
jobs:
  language-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: unlaxer-dsl/ubnf-vscode
      - run: python3 scripts/language-profile-corpus.py --check
      - run: python3 scripts/language-profile-packages.py --check
      - run: python3 scripts/language-profile-edit-replay.py --check
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=LanguageProfileSelectionTest,LSPProfileInitializationTest,LSPCompileVerificationTest,LSPNonBmpOffsetTest,PackagedLanguageProfileConformanceTest,LanguageProfileConformanceTest,LanguageProfileEditReplayConformanceTest,LanguageProfileCommandTest,PlaygroundCommandTest,RustUbnfFrontendConformanceTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - run: test -s unlaxer-dsl/target/language-profile-edit-replay.tsv
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-runtime --test language_profile
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-generator --test language_profiles
      - uses: actions/upload-artifact@v4
        with:
          name: language-profile-observations
          path: unlaxer-dsl/target/language-profile-*.tsv
          if-no-files-found: error
