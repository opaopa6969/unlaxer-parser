name: embedded-grammars
on:
  push:
    branches: [master]
  pull_request:
jobs:
  embedded-grammars:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Rust toolchain を既定を変更せずに準備
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=EmbeddedLanguagesTest,EmbeddedGrammarConformanceTest,PlaygroundCommandTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-runtime --test embedded
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-generator --test embedded --test playground
      - name: Browser language-region editing
        working-directory: unlaxer-dsl/ubnf-vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
          node scripts/embedded-regions-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-region-browser-observations
          path: unlaxer-dsl/ubnf-vscode/target/embedded-regions.tsv
