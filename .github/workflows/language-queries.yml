name: language-queries
on:
  push:
    branches: [master]
  pull_request:
jobs:
  language-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=LanguageQueriesTest,LanguageProfileSelectionTest,LSPQueryConsumerTest,LSPProfileInitializationTest,LSPCompileVerificationTest,LSPNonBmpOffsetTest,PlaygroundCommandTest -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-runtime --test language_queries
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-generator --test playground
