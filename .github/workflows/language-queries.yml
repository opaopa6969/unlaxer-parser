name: language-queries
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  language-queries:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - name: Select job temporary directory (#1045)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          MAVEN_OPTS: -Djava.io.tmpdir=${{ runner.temp }} -Dunlaxer.test.tmpdir=${{ runner.temp }} -DadditionalJOption=-J-Djava.io.tmpdir=${{ runner.temp }}
        run: |
          printf '%s\n' "TMPDIR=$TMPDIR" "TMP=$TMP" "TEMP=$TEMP" "MAVEN_OPTS=$MAVEN_OPTS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - name: Rust toolchain を既定を変更せずに準備
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare required tests (language-queries)
        run: python3 scripts/verify-optin-tests.py language-queries --prepare
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=LanguageQueriesTest,LanguageProfileSelectionTest,LSPQueryConsumerTest,LSPProfileInitializationTest,LSPCompileVerificationTest,LSPNonBmpOffsetTest,PlaygroundQueryConformanceTest,PlaygroundCommandTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify required tests (language-queries)
        id: verify-language-queries
        if: success()
        run: python3 scripts/verify-optin-tests.py language-queries
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.verify-language-queries.outcome != 'skipped' }}
        with:
          name: optin-language-queries
          path: |
            target/optin-evidence/language-queries/
          if-no-files-found: error
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-runtime --test language_queries
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-generator --test playground
      - name: Browser query capabilities and snapshot-safe edits
        working-directory: unlaxer-dsl/ubnf-vscode
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" npm ci --ignore-scripts --no-audit --no-fund
          bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" npx playwright install chromium
          node scripts/playground-queries-browser.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: playground-query-observations
          path: unlaxer-dsl/ubnf-vscode/target/playground-queries.tsv
