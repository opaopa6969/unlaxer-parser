name: tinyexpression-production
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  production-bridge:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: opaopa6969/tinyexpression
          ref: f86ce8a5ab0ab7d23fdba2cd477187df8aa7607c
          path: target/tiny-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - name: Rust toolchain を既定を変更せずに準備
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
      - name: Check dependency restoration and compatibility report guards
        run: python3 scripts/run-required-unittests.py discover -s scripts/tests -p test_tiny_production_dependencies.py
      - name: Run real production parsers, source mapping and existing editor compatibility
        run: python3 scripts/check-tiny-production.py target/tiny-source --maven-repo "$UNLAXER_MAVEN_REPOSITORY"
      - name: Require this checkout's jars in the job Maven repository
        run: |
          version=$(python3 -c 'import json; print(json.load(open("target/tiny-production/current-dependencies.json"))["revision"])')
          bash scripts/check-job-maven-repository.sh . "$version"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyexpression-production-observations
          path: |
            target/tiny-production/*.tsv
            target/tiny-production/*-dependencies.txt
            target/tiny-production/*.json
            target/tiny-source/target/surefire-reports
            target/tiny-source/tools/tinyexpression-p4-lsp-vscode/target/surefire-reports
