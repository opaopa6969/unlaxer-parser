name: tinyexpression-production
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: tinyexpression-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: opaopa6969/tinyexpression
          ref: f86ce8a5ab0ab7d23fdba2cd477187df8aa7607c
          path: target/tiny-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          cache: maven
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Run real production parsers, source mapping and existing editor compatibility
        run: python3 scripts/check-tiny-production.py target/tiny-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tinyexpression-production-observations
          path: |
            target/tiny-production/*.tsv
            target/tiny-source/target/surefire-reports
            target/tiny-source/tools/tinyexpression-p4-lsp-vscode/target/surefire-reports
