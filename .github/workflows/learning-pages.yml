name: Learning playground Pages

on:
  push:
    branches: [master]
    paths:
      - 'unlaxer-dsl/src/main/resources/learning/**'
      - 'unlaxer-dsl/src/main/resources/playground/**'
      - 'unlaxer-dsl/src/main/resources/ubnf-playground/**'
      - 'unlaxer-dsl/src/main/resources/ubnf-help/**'
      - 'unlaxer-dsl/grammar/ubnf.ubnf'
      - 'rust/**'
      - 'scripts/build-learning.mjs'
      - 'unlaxer-dsl/ubnf-vscode/scripts/learning-browser.mjs'
      - 'unlaxer-dsl/ubnf-vscode/scripts/completion*.mjs'
      - '.github/workflows/learning-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'learning-pages' || format('learning-pages-verify-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare Rust and WASM
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update --target wasm32-unknown-unknown
      - name: Build the static learning site
        run: node scripts/build-learning.mjs
      - name: Verify all lessons in a browser
        working-directory: unlaxer-dsl/ubnf-vscode
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" npm ci
          bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" npx playwright install chromium
          node --test scripts/completion.test.mjs
          node scripts/learning-browser.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/learning-site
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: [unlaxer-parser-ci, Linux, X64]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    env:
      # The runners' resolver answers A for api.github.com at once but leaves AAAA unanswered
      # for 10-15 s. Node waits for both, so the Pages actions hit their 10 s connect timeout
      # ("Connect Timeout Error", run 39976413660). One 2 s try per query keeps the lookup
      # near 4 s; glibc 2.35 on the runners has no no-aaaa option.
      RES_OPTIONS: single-request timeout:2 attempts:1
    # Neither action retries a connection failure. Each runs at most twice: the first try may
    # fail, the second one decides the job. Both are safe to repeat: configure-pages only reads
    # the site, and deploy-pages can only publish the artifact this run uploaded.
    steps:
      - uses: actions/configure-pages@v5
        id: configure
        continue-on-error: true
      - name: Wait before configuring Pages again
        if: steps.configure.outcome == 'failure'
        run: sleep 30
      - uses: actions/configure-pages@v5
        if: steps.configure.outcome == 'failure'
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait before deploying Pages again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
