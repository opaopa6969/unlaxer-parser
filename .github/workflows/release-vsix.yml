# タグ push (v*) で UBNF VSIX をビルドし GitHub Release に添付する。
name: Release VSIX

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js (for vsce)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install unlaxer to local repo
      run: mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true

    - name: Build ubnf-vscode VSIX
      run: mvn -B -pl unlaxer-dsl/ubnf-vscode verify -Dgpg.skip=true

    - name: Create release and attach VSIX
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" || true
        gh release upload "$GITHUB_REF_NAME" unlaxer-dsl/ubnf-vscode/target/*.vsix --clobber
