name: Java CI with Maven

# Standard hosted runners keep independent jobs off the shared development disk.
# This is a public repository; standard runners do not incur execution charges.
# Do not restore or upload the multi-GB local Maven repository as a remote cache.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Superseded revisions of one PR can stop; other PRs and master runs are independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust backend and Java conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        overwrite-settings: false
    - name: Set up Rust (minimum supported version)
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
        rustup target add --toolchain 1.85.0 wasm32-unknown-unknown
        echo "RUSTUP_TOOLCHAIN=1.85.0" >> "$GITHUB_ENV"
    - name: Rust standalone checks
      run: |
        cargo fmt --all --manifest-path rust/Cargo.toml --check
        cargo test --locked --manifest-path rust/Cargo.toml
        cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
    # UbnfSpecCorpusTest は spec-corpus/ubnf/*.json の Java 側の駆動。Rust 側の
    # rust/unlaxer-ubnf/tests/spec_corpus.rs は同 job の `cargo test` が回すので、
    # 同じ fixture の Java / Rust 両方が 1 つの job で緑になることを見えるようにする。
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Check pinned Unicode XID tables
      run: python3 scripts/generate-xid-tables.py --check
    - name: Cross-language fixtures, compile failures, and generated-file drift
      run: >
        mvn -B -pl unlaxer-common,unlaxer-dsl -am test
        -Dtest=RustBackendTest,RustConformanceTest,RustUbnfFrontendConformanceTest,RustUbnfSourceConformanceTest,RustPortabilityConformanceTest,TokenAdapterConformanceTest,ParseBindingsConformanceTest,DeclarativeTokenConformanceTest,ApiImpactConformanceTest,UbnfSpecCorpusTest,NumericCaptureRuntimeTest,RustNativeEmitterTest,RustNativeGeneratorTest,RuleTriviaConformanceTest,PackageResolverConformanceTest,HttpsPackageConformanceTest,VocabularyOriginsConformanceTest,ScopeStoreConformanceTest,ScopeAnnotationConformanceTest,NestedCaptureConformanceTest,RustCatalogConformanceTest,SkipMappingConformanceTest,CaptureEqualityConformanceTest,ErrorElementConformanceTest,RecoveryConformanceTest,SemanticModelConformanceTest,SemanticRulesConformanceTest,PreprocessingConformanceTest,ProjectSymbolIndexConformanceTest,EditorParseResultConformanceTest,TypeSystemConformanceTest,CallInferenceConformanceTest,SemanticQueriesConformanceTest,SemanticQueryEditsTest,SemanticModelUbnfTest,TokenStreamConformanceTest,EditorPipelineConformanceTest,EditorCstTest,UniqueLongestConformanceTest,NameSnapshotConformanceTest,NamePredicateConformanceTest,ContextualLexingConformanceTest,CodePointEscapeConformanceTest -DrustConformance=true -DtokenStreamBench=true
        -Dsurefire.failIfNoSpecifiedTests=false
    - name: Resolver tutorial (Java and Rust)
      run: |
        python3 examples/resolver-tutorial/run.py build
        python3 examples/resolver-tutorial/run.py check
        cargo clippy --locked --manifest-path examples/resolver-tutorial/rust/Cargo.toml --all-targets -- -D warnings
        rustfmt --edition 2021 --config skip_children=true --check examples/resolver-tutorial/rust/src/main.rs examples/resolver-tutorial/rust/src/resolvers.rs
        test -s examples/resolver-tutorial/target/conformance.tsv
    - name: Generated WASM playground in Chromium
      working-directory: unlaxer-dsl/ubnf-vscode
      run: |
        npm ci
        npx playwright install --with-deps chromium
        node scripts/contextual-lexing-reference.mjs
        node scripts/contextual-lexing-wasm.mjs
        node scripts/playground-browser.mjs
        node scripts/editor-playground-browser.mjs
        node --test scripts/completion.test.mjs
        node scripts/learning-browser.mjs
    - name: Require selectable lexing conformance and measurement evidence
      run: |
        test -s unlaxer-dsl/target/rust-token-stream.tsv
        test -s unlaxer-dsl/target/token-stream-benchmark.tsv
        test -s unlaxer-dsl/target/rust-contextual-lexing.tsv
        test -s unlaxer-dsl/target/rust-contextual-lexing-invalid.tsv
        test -s unlaxer-dsl/target/rust-contextual-lexing-boundaries.tsv
        test -s unlaxer-dsl/ubnf-vscode/target/contextual-lexing-reference.tsv
        test -s unlaxer-dsl/ubnf-vscode/target/contextual-lexing-wasm.tsv
    - name: Require semantic model and generated UBNF evidence
      run: |
        test -s unlaxer-dsl/target/rust-semantic-model.tsv
        test -s unlaxer-dsl/target/rust-semantic-rules.tsv
        test -s unlaxer-dsl/target/rust-preprocessing.tsv
        test -s unlaxer-dsl/target/rust-project-symbols.tsv
        test -s unlaxer-dsl/target/rust-type-relations.tsv
        test -s unlaxer-dsl/target/rust-call-inference.tsv
        test -s unlaxer-dsl/target/rust-semantic-queries.tsv
        test -s unlaxer-dsl/target/rust-semantic-query-edits.tsv
        test -s unlaxer-dsl/target/java-query-retention-metrics.tsv
        test -s unlaxer-dsl/target/rust-query-retention-metrics.tsv
        test -s unlaxer-dsl/target/rust-semantic-ubnf.tsv
        test -s unlaxer-dsl/target/rust-editor-pipeline.tsv
        test -s unlaxer-dsl/ubnf-vscode/target/editor-playground.tsv
    - name: Require UBNF source position conformance evidence
      run: test -s unlaxer-dsl/target/rust-ubnf-source.tsv
    - name: Require portability check conformance evidence
      run: test -s unlaxer-dsl/target/rust-portability.tsv
    - name: Require token adapter diagnostics and runtime evidence
      run: |
        test -s unlaxer-dsl/target/rust-token-adapter-diagnostics.tsv
        test -s unlaxer-dsl/target/rust-token-adapter-runtime.tsv
        test -s unlaxer-dsl/target/rust-parse-bindings.tsv
    - name: Require declarative token codegen and runtime evidence
      run: test -s unlaxer-dsl/target/rust-declarative-token-runtime.tsv
    - name: Require API evolution reports and real compiler evidence
      run: |
        test -s unlaxer-dsl/target/api-impact-conformance.tsv
        test -s unlaxer-dsl/target/api-impact-compile.tsv
    - name: Require rule trivia conformance evidence
      run: |
        test -s unlaxer-dsl/target/rust-rule-trivia.tsv
        test -s unlaxer-dsl/target/rust-unique-longest.tsv
        test -s unlaxer-dsl/target/rust-name-snapshots.tsv
        test -s unlaxer-dsl/target/rust-name-predicate.tsv
    - name: Require pinned package conformance evidence
      run: |
        test -s unlaxer-dsl/target/rust-packages.tsv
        test -s unlaxer-dsl/target/rust-package-https.tsv
        test -s unlaxer-dsl/target/rust-vocabulary-origins.tsv
    - name: Require transactional scope conformance evidence
      run: test -s unlaxer-dsl/target/rust-scope-store.tsv
    - name: Require generated scope annotation conformance evidence
      run: test -s unlaxer-dsl/target/rust-scope-annotations.tsv
    - name: Require nested capture conformance evidence
      run: test -s unlaxer-dsl/target/rust-nested-captures.tsv
    - name: Require catalog metadata conformance evidence
      run: test -s unlaxer-dsl/target/rust-catalog-metadata.tsv
    - name: Require skip projection conformance evidence
      run: test -s unlaxer-dsl/target/rust-skip-mapping.tsv
    - name: Require capture equality conformance evidence
      run: test -s unlaxer-dsl/target/rust-capture-equality.tsv
    - name: Require ERROR element conformance evidence
      run: test -s unlaxer-dsl/target/rust-error-elements.tsv
    - name: Require recovery conformance evidence
      run: test -s unlaxer-dsl/target/rust-recovery.tsv
    - uses: actions/upload-artifact@v4
      with:
        name: rust-conformance
        path: |
          unlaxer-dsl/target/rust-token-stream.tsv
          unlaxer-dsl/target/token-stream-benchmark.tsv
          unlaxer-dsl/target/rust-contextual-lexing.tsv
          unlaxer-dsl/target/rust-contextual-lexing-invalid.tsv
          unlaxer-dsl/target/rust-contextual-lexing-boundaries.tsv
          unlaxer-dsl/ubnf-vscode/target/contextual-lexing-reference.tsv
          unlaxer-dsl/ubnf-vscode/target/contextual-lexing-wasm.tsv
          unlaxer-dsl/target/rust-semantic-model.tsv
          unlaxer-dsl/target/rust-semantic-rules.tsv
          unlaxer-dsl/target/rust-preprocessing.tsv
          unlaxer-dsl/target/rust-project-symbols.tsv
          unlaxer-dsl/target/rust-type-relations.tsv
          unlaxer-dsl/target/rust-call-inference.tsv
          unlaxer-dsl/target/rust-semantic-queries.tsv
          unlaxer-dsl/target/rust-semantic-query-edits.tsv
          unlaxer-dsl/target/java-query-retention-metrics.tsv
          unlaxer-dsl/target/rust-query-retention-metrics.tsv
          unlaxer-dsl/target/rust-semantic-ubnf.tsv
          unlaxer-dsl/target/rust-editor-pipeline.tsv
          unlaxer-dsl/ubnf-vscode/target/editor-playground.tsv
          unlaxer-dsl/target/rust-conformance.tsv
          unlaxer-dsl/target/rust-diagnostics.tsv
          unlaxer-dsl/target/rust-diagnostics-edge.tsv
          unlaxer-dsl/target/rust-cardinality.tsv
          unlaxer-dsl/target/rust-primitives.tsv
          unlaxer-dsl/target/rust-lexical.tsv
          unlaxer-dsl/target/rust-ubnf-frontend.tsv
          unlaxer-dsl/target/rust-ubnf-source.tsv
          unlaxer-dsl/target/rust-portability.tsv
          unlaxer-dsl/target/rust-token-adapter-diagnostics.tsv
          unlaxer-dsl/target/rust-token-adapter-runtime.tsv
          unlaxer-dsl/target/rust-parse-bindings.tsv
          examples/resolver-tutorial/target/conformance.tsv
          unlaxer-dsl/target/rust-declarative-token-runtime.tsv
          unlaxer-dsl/target/api-impact-conformance.tsv
          unlaxer-dsl/target/api-impact-compile.tsv
          unlaxer-dsl/target/rust-associative.tsv
          unlaxer-dsl/target/rust-right-associative.tsv
          unlaxer-dsl/target/rust-mixed-values.tsv
          unlaxer-dsl/target/rust-delimited-mixed-values.tsv
          unlaxer-dsl/target/rust-shared-mixed-values.tsv
          unlaxer-dsl/target/semantic-cardinality-java.tsv
          unlaxer-dsl/target/semantic-cardinality-rust.tsv
          unlaxer-dsl/target/semantic-cardinality-both.tsv
          unlaxer-dsl/target/rust-native-generator.tsv
          unlaxer-dsl/target/rust-rule-trivia.tsv
          unlaxer-dsl/target/rust-unique-longest.tsv
          unlaxer-dsl/target/rust-name-snapshots.tsv
          unlaxer-dsl/target/rust-name-predicate.tsv
          unlaxer-dsl/target/rust-packages.tsv
          unlaxer-dsl/target/rust-package-https.tsv
          unlaxer-dsl/target/rust-vocabulary-origins.tsv
          unlaxer-dsl/target/rust-scope-store.tsv
          unlaxer-dsl/target/rust-scope-annotations.tsv
          unlaxer-dsl/target/rust-nested-captures.tsv
          unlaxer-dsl/target/rust-catalog-metadata.tsv
          unlaxer-dsl/target/rust-skip-mapping.tsv
          unlaxer-dsl/target/rust-capture-equality.tsv
          unlaxer-dsl/target/rust-error-elements.tsv
          unlaxer-dsl/target/rust-recovery.tsv
        if-no-files-found: error
    - name: Build and smoke-test the native subset example
      run: |
        cargo build --release --locked --manifest-path rust/Cargo.toml -p unlaxer-evolution-example
        printf '%s\n' 'if(0,neg(2*3),4+5)' | rust/target/release/unlaxer-evolution-example | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["value"] == 9'
        cp spec-corpus/xid-identifier/UNICODE-LICENSE.txt rust/target/release/UNICODE-LICENSE.txt
        tar -czf rust/target/unlaxer-evolution-linux-x86_64.tar.gz -C rust/target/release unlaxer-evolution-example UNICODE-LICENSE.txt
    - name: Build and smoke-test the JVM-free generator
      run: |
        cargo build --release --locked --manifest-path rust/Cargo.toml -p unlaxer-generator
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer generate --grammar unlaxer-dsl/src/test/resources/evolution/3/Evolution.ubnf --output rust/examples/evolution/src/generated --check
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer check --target rust --grammar unlaxer-dsl/src/test/resources/evolution/3/Evolution.ubnf --format json
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer check --target rust --grammar spec-corpus/error-elements/expected.ubnf --format json | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["portable"] and not r["diagnostics"]'
        error_generated_dir="$(mktemp -d)"
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer generate --grammar spec-corpus/error-elements/expected.ubnf --output "$error_generated_dir"
        for module in mod.rs ast.rs parser.rs mapper.rs evaluator.rs; do test -s "$error_generated_dir/$module"; done
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer check --target rust --grammar spec-corpus/recovery/example.ubnf --format json | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["portable"] and not r["diagnostics"]'
        recovery_generated_dir="$(mktemp -d)"
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer generate --grammar spec-corpus/recovery/example.ubnf --output "$recovery_generated_dir"
        for module in mod.rs ast.rs parser.rs mapper.rs evaluator.rs; do test -s "$recovery_generated_dir/$module"; done
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer impact --target rust --before spec-corpus/api-impact/node-add/before.ubnf --after spec-corpus/api-impact/node-add/after.ubnf | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and [(c["kind"], c["subject"]) for c in r["changes"]] == [("METHOD_ADDED", "eval_extra"), ("NODE_ADDED", "Extra")]'
        tar -czf rust/target/unlaxer-generator-linux-x86_64.tar.gz -C rust/target/release unlaxer UNICODE-LICENSE.txt
    - uses: actions/upload-artifact@v4
      with:
        name: unlaxer-generator-linux-x86_64
        path: rust/target/unlaxer-generator-linux-x86_64.tar.gz
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: unlaxer-evolution-linux-x86_64
        path: rust/target/unlaxer-evolution-linux-x86_64.tar.gz
        if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        overwrite-settings: false

    # Maven's native emitter comparison intentionally runs Cargo offline.
    - name: Prepare locked Rust dependencies for offline generator tests
      run: |
        rustup toolchain install 1.85.0 --profile minimal
        echo "RUSTUP_TOOLCHAIN=1.85.0" >> "$GITHUB_ENV"
        cargo +1.85.0 fetch --locked --manifest-path rust/Cargo.toml

    - name: Validate Central release guard
      run: |
        python3 scripts/tests/test_central_release_guard.py
        python3 scripts/tests/test_version_sync.py
        bash -n scripts/release-central.sh
        
    - name: Build with Maven
      run: mvn -B clean test

    # #311: the main artifacts stay Java 21 (major 65); the -jdk17 ones are major 61.
    - name: Package library jars and check class file majors
      run: |
        mvn -B -pl .,unlaxer-common,unlaxer-dsl,unlaxer-common-jdk17,unlaxer-dsl-jdk17 package -DskipTests -Dgpg.skip=true
        artifact_version=$(mvn -q help:evaluate -Dexpression=revision -DforceStdout)
        python3 scripts/check_class_major.py 65 "unlaxer-common/target/unlaxer-common-${artifact_version}.jar" "unlaxer-dsl/target/unlaxer-dsl-${artifact_version}.jar"
        python3 scripts/check_class_major.py 61 "unlaxer-common-jdk17/target/unlaxer-common-jdk17-${artifact_version}.jar" "unlaxer-dsl-jdk17/target/unlaxer-dsl-jdk17-${artifact_version}.jar"

    # 静的解析 (issue #37): Error Prone (compile 時) + SpotBugs。
    # 生成コードは除外 (config/spotbugs-exclude.xml / -XepExcludedPaths)。
    - name: Static analysis (Error Prone + SpotBugs)
      run: >
        mvn -B -Pstatic-analysis -pl unlaxer-common,unlaxer-dsl
        clean test-compile
        com.github.spotbugs:spotbugs-maven-plugin:4.10.2.0:check

  # Java 17 artifacts (#311): the *-jdk17 modules recompile the same sources with release 17.
  # Build and test them on a Java 17 JVM (profile jdk17-tests turns their tests on) and require
  # class file major 61 in every class of their jars.
  build-jdk17:
    name: "*-jdk17 artifacts on JDK 17"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        overwrite-settings: false

    # Maven's native emitter comparison intentionally runs Cargo offline.
    - name: Prepare locked Rust dependencies for offline generator tests
      run: |
        rustup toolchain install 1.85.0 --profile minimal
        echo "RUSTUP_TOOLCHAIN=1.85.0" >> "$GITHUB_ENV"
        cargo +1.85.0 fetch --locked --manifest-path rust/Cargo.toml

    - name: Build and test the -jdk17 modules on JDK 17
      run: mvn -B -pl unlaxer-common-jdk17,unlaxer-dsl-jdk17 -am clean package -Dgpg.skip=true

    - name: Require class file major 61 (Java 17) in the -jdk17 jars
      run: |
        artifact_version=$(mvn -q help:evaluate -Dexpression=revision -DforceStdout)
        python3 scripts/check_class_major.py 61 "unlaxer-common-jdk17/target/unlaxer-common-jdk17-${artifact_version}.jar" "unlaxer-dsl-jdk17/target/unlaxer-dsl-jdk17-${artifact_version}.jar"

  # UBNF VSIX を成果物として添付する。タグ push 時の Release 添付は
  # release-vsix.yml を参照。
  vsix:
    name: UBNF VSIX (ubnf-vscode)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        overwrite-settings: false

    - name: Set up Node.js (for vsce)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install unlaxer to local repo
      run: mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true

    - name: Build ubnf-vscode VSIX
      run: mvn -B -pl unlaxer-dsl/ubnf-vscode verify -Dgpg.skip=true

    - name: Verify authoring help in Chromium and the webview host
      working-directory: unlaxer-dsl/ubnf-vscode
      run: |
        npx playwright install --with-deps chromium
        npm run test:help

    - name: Activate the packaged VSIX with isolated VS Code profiles
      working-directory: unlaxer-dsl/ubnf-vscode
      env:
        RUSTUP_TOOLCHAIN: 1.85.0
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
        xvfb-run -a npm run test:vsix

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: ubnf-lsp-vsix
        path: unlaxer-dsl/ubnf-vscode/target/*.vsix
        if-no-files-found: error

  # downstream 検証: 3.0.3 の @scopeTree リグレッションは unlaxer 自身の
  # テストでは検出されず tinyexpression の LSP smoke で発覚した (#38)。
  # ビルド中の unlaxer に対して downstream の smoke を回し、再発を防ぐ。
  downstream:
    name: Downstream smoke (tinyexpression)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4
      with:
        path: unlaxer-parser

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        overwrite-settings: false

    - name: Install unlaxer to local repo
      working-directory: unlaxer-parser
      run: mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true

    - name: Resolve unlaxer version under test
      id: unlaxer
      working-directory: unlaxer-parser
      run: |
        if ! output="$(mvn -q help:evaluate -Dexpression=revision -DforceStdout 2>&1)"; then
          printf '%s\n' "$output" >&2
          exit 1
        fi
        mapfile -t versions < <(printf '%s\n' "$output" | sed -nE '/^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$/p')
        if [ "${#versions[@]}" -ne 1 ]; then
          printf 'Expected exactly one Maven revision, got %s:\n%s\n' "${#versions[@]}" "$output" >&2
          exit 1
        fi
        printf 'version=%s\n' "${versions[0]}" >> "$GITHUB_OUTPUT"

    - name: Checkout tinyexpression
      uses: actions/checkout@v4
      with:
        repository: opaopa6969/tinyexpression
        # Real LongCodeBlockParser + source-preserving AST, tinyexpression #236 / #237.
        # Keep the token oracle and downstream grammar synchronized with #316.
        ref: 7d7bd1cbfab1bd9548ba53c73cc50502f0437c67
        path: tinyexpression

    - name: Point tinyexpression at the unlaxer under test
      working-directory: tinyexpression
      run: >
        mvn -B versions:use-dep-version
        -Dincludes='org.unlaxer:unlaxer-common,org.unlaxer:unlaxer-dsl'
        -DdepVersion='${{ steps.unlaxer.outputs.version }}'
        -DforceVersion=true -DgenerateBackupPoms=false

    - name: tinyexpression p4-smoke
      working-directory: tinyexpression
      run: mvn -B -P p4-smoke test -Dgpg.skip=true

    - name: tinyexpression generated Node alias contract
      working-directory: tinyexpression
      run: >
        mvn -B test -Dgpg.skip=true
        -Dtinyexpression.expected.mapper.snapshot=true
        -Dtinyexpression.expected.mapper.nodeAlias=true
        -Dtest=P4SourceMappingTest,P4OwnedSliceSourceTest

    - name: Install tinyexpression (for LSP smoke)
      working-directory: tinyexpression
      run: mvn -B install -DskipTests -Dgpg.skip=true

    - name: Set up Rust for actual tinyexpression token conformance
      run: |
        rustup toolchain install 1.85.0 --profile minimal
        echo "RUSTUP_TOOLCHAIN=1.85.0" >> "$GITHUB_ENV"

    - name: Compare real tinyexpression external tokens with both Rust generators
      working-directory: unlaxer-parser
      run: |
        mvn -B -pl unlaxer-dsl test -Dtest=TinyStringTokenConformanceTest,TinyCodeFenceConformanceTest -DrustConformance=true \
          -Dtinyexpression.classes="$GITHUB_WORKSPACE/tinyexpression/target/classes"
        test -s unlaxer-dsl/target/rust-tiny-string.tsv
        test -s unlaxer-dsl/target/rust-tiny-code-fence.tsv
        test -s unlaxer-dsl/target/rust-tiny-string-adapters.tsv
        test -s unlaxer-dsl/target/rust-tiny-code-fence-adapters.tsv

    - uses: actions/upload-artifact@v4
      with:
        name: tiny-token-adapter-conformance
        path: |
          unlaxer-parser/unlaxer-dsl/target/rust-tiny-string-adapters.tsv
          unlaxer-parser/unlaxer-dsl/target/rust-tiny-code-fence-adapters.tsv
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: tiny-string-token-conformance
        path: unlaxer-parser/unlaxer-dsl/target/rust-tiny-string.tsv
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: tiny-code-fence-conformance
        path: unlaxer-parser/unlaxer-dsl/target/rust-tiny-code-fence.tsv
        if-no-files-found: error

    - name: Check actual tinyexpression portability and injected diagnostics in both hosts
      working-directory: unlaxer-parser
      run: |
        mvn -B -pl unlaxer-dsl test -Dtest=RustPortabilityConformanceTest -DrustConformance=true \
          -Dtinyexpression.grammar="$GITHUB_WORKSPACE/tinyexpression/tools/tinyexpression-p4-lsp-vscode/grammar/tinyexpression-p4.ubnf"
        test -s unlaxer-dsl/target/rust-portability-tiny.tsv

    - uses: actions/upload-artifact@v4
      with:
        name: tiny-portability-conformance
        path: unlaxer-parser/unlaxer-dsl/target/rust-portability-tiny.tsv
        if-no-files-found: error

    # 3.0.3 リグレッションを実際に検出したのはこの LSP smoke
    - name: tinyexpression LSP smoke
      working-directory: tinyexpression/tools/tinyexpression-p4-lsp-vscode
      env:
        MAVEN_OPTS: >-
          --add-opens=java.base/java.util=ALL-UNNAMED
          --add-opens=java.base/java.lang=ALL-UNNAMED
      run: >
        mvn -B versions:use-dep-version
        -Dincludes='org.unlaxer:unlaxer-dsl'
        -DdepVersion='${{ steps.unlaxer.outputs.version }}'
        -DforceVersion=true -DgenerateBackupPoms=false
        && mvn -B -P p4-smoke test -Dgpg.skip=true
