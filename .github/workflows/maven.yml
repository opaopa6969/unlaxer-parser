name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      # Exclude tinycalc-vscode (example module) until its grammar is updated
      # to match v3.0.2 strict @leftAssoc validator. Tracked in #29.
      run: mvn -B clean test -pl '!unlaxer-dsl/tinycalc-vscode' -am
