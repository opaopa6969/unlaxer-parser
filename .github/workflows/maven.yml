name: Java CI with Maven

# Repository-scoped self-hosted runner (hosted minutes are billed against the
# account quota even for this public repository; 2026-10 ran out at ~6,400 min).
# Do not restore or upload the multi-GB local Maven repository as a remote cache.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Superseded revisions of one PR can stop; other PRs and master runs are independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust backend and Java conformance
    runs-on: [unlaxer-parser-ci, Linux, X64]
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        overwrite-settings: false
    - name: Set up Rust (minimum supported version)
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
        rustup target add --toolchain 1.85.0 wasm32-unknown-unknown
        echo "RUSTUP_TOOLCHAIN=1.85.0" >> "$GITHUB_ENV"
    - name: Rust standalone checks
      run: |
        cargo fmt --all --manifest-path rust/Cargo.toml --check
        cargo test --locked --manifest-path rust/Cargo.toml
        cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
    # UbnfSpecCorpusTest は spec-corpus/ubnf/*.json の Java 側の駆動。Rust 側の
    # rust/unlaxer-ubnf/tests/spec_corpus.rs は同 job の `cargo test` が回すので、
    # 同じ fixture の Java / Rust 両方が 1 つの job で緑になることを見えるようにする。
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Check pinned Unicode XID, grapheme, and case tables
      run: |
        python3 scripts/generate-xid-tables.py --check
        python3 scripts/generate-grapheme-tables.py --check
        python3 scripts/generate-case-tables.py --check
        (cd spec-corpus/case-insensitive/unicode-17.0.0 && sha256sum --check SHA256SUMS)
        (cd spec-corpus/grapheme/unicode-17.0.0 && sha256sum --check SHA256SUMS)
    - name: Cross-language fixtures, compile failures, and generated-file drift
      run: >
        mvn -B -pl unlaxer-common,unlaxer-dsl -am test
        -Dtest=RustBackendTest,RustConformanceTest,RustUbnfFrontendConformanceTest,RustUbnfSourceConformanceTest,RustPortabilityConformanceTest,TokenAdapterConformanceTest,JavaTokenBindingConformanceTest,UnicodeIgnoreCaseWordParserTest,CaseInsensitiveConformanceTest,GraphemeTest,GraphemeConformanceTest,ParseBindingsConformanceTest,DeclarativeTokenConformanceTest,ApiImpactConformanceTest,UbnfSpecCorpusTest,NumericCaptureRuntimeTest,RustNativeEmitterTest,RustNativeGeneratorTest,RuleTriviaConformanceTest,ScopeStoreConformanceTest,ScopeAnnotationConformanceTest,NestedCaptureConformanceTest,RustCatalogConformanceTest,SkipMappingConformanceTest,CaptureEqualityConformanceTest,ErrorElementConformanceTest,RecoveryConformanceTest,SemanticModelConformanceTest,ProjectSymbolIndexConformanceTest,EditorParseResultConformanceTest,EditorPipelineConformanceTest,EditorCstTest,SemanticModelUbnfTest,TokenStreamConformanceTest,TypeSystemConformanceTest,CallInferenceConformanceTest,SemanticQueriesConformanceTest,SemanticQueryEditsTest,PackageResolverConformanceTest,HttpsPackageConformanceTest,VocabularyOriginsConformanceTest,SemanticRulesConformanceTest,SemanticDiagnosticConformanceTest,ClassicLspProtocolConformanceTest,ClassicSemanticTokensConformanceTest,LSPQueryConsumerTest,LSPNonBmpOffsetTest,LSPProfileInitializationTest,PreprocessingConformanceTest,UniqueLongestConformanceTest,NameSnapshotConformanceTest,NamePredicateConformanceTest,ContextualLexingConformanceTest,CodePointEscapeConformanceTest,ClassicDapProtocolConformanceTest,ClassicTokenDapProtocolConformanceTest,TokenTraceConformanceTest,NonOrderedParityTest,NonOrderedStateTest,ClassicLspLifecycleConformanceTest,ClassicLspDiagnosticsConformanceTest,EnumConformanceTest,PegLookaheadTest,PegLookaheadStateTest,ClassicLspKeywordConformanceTest,DapLauncherLifecycleConformanceTest,MixedEnumConformanceTest,IncrementalCacheConformanceTest,CommonFieldConformanceTest,NumericCaptureConformanceTest,GeneralTokenPropagationTest,GeneralLexicalPropagationTest,GeneralTokenPropagationStateTest,EvaluationConformanceTest,ApiImpactOverloadTest,TypeofConformanceTest,ObserverFailureTest,ObserverScopeStateTest,RecursiveHelperConformanceTest,PreferredAstConformanceTest,FamilyProjectionConformanceTest,LeftRecursionConformanceTest,OwnedCaptureTest,AssociativeProjectionConformanceTest,AssociativeDelimiterConformanceTest,AssociativeNullableDelimiterConformanceTest,AtomicTriviaConformanceTest,ZeroRepeatBoundaryTest,ZeroRepeatGenerationTest,RegexRetirementConformanceTest,CaptureBoundaryTest,NullableRepeatStateTest,NullableRepeatConformanceTest,NullableSeparationStateTest,NullableSeparationConformanceTest,MemoResetPolicyTest,MemoEvictionTest,MemoResourceDepthTest,TypedNestedSchemaTest,TypedNestedCaptureConformanceTest,PureSuccessRollbackTest,PureSuccessMemoizationConformanceTest,VersionedFailureMemoizationConformanceTest,SafeSuccessMemoizationTest,ResourcePublicationTest,NestedMappedCaptureConformanceTest,ClassicMemoizationConformanceTest,OwnedCaptureConformanceTest,OwnedCaptureSyntaxTest,NestedSharedFieldConformanceTest,MappingGuardTest,PublicMapperCstConformanceTest,OrdinaryParserExceptionTest,OrdinaryExceptionOracleTest,PriorMatchedDiagnosticsTest,OrdinaryParserExceptionConformanceTest,NestedSeparatedBoundaryTest,NestedSeparatedCaptureConformanceTest,NestedMixedValueConformanceTest,NestedSeparatedMappedCaptureConformanceTest,FailureMemoBudgetTest,FailureMemoBudgetConformanceTest,SuccessMemoBudgetTest,SuccessMemoBudgetConformanceTest,ParserScalingSmokeTest,MemoScalingConformanceTest,OwnedNestedCaptureConformanceTest,NestedTypeofConformanceTest,NestedAutoEvalConformanceTest,NestedAliasCaptureConformanceTest,FailureMemoConfigurationTest,PropertyBasedParityTest -DrustConformance=true -DtokenStreamBench=true
        -Dsurefire.failIfNoSpecifiedTests=false
    # PropertyBasedParityTest (#705): fixed seeds 1..24 plus spec-corpus/property-based/regressions.json.
    - name: Require property-based parity evidence
      run: |
        test -s unlaxer-dsl/target/property-based-parity-stats.txt
        test -s unlaxer-dsl/target/property-based-parity-observations.jsonl
        grep -qx '\[\]' unlaxer-dsl/target/property-based-parity.json
    - name: Require nested typeof conformance evidence
      run: |
        test -s unlaxer-dsl/target/nested-typeof-java.tsv
        test -s unlaxer-dsl/target/nested-typeof-conformance.tsv
        awk 'END {exit NR != 307}' unlaxer-dsl/target/nested-typeof-java.tsv
        awk 'END {exit NR != 613}' unlaxer-dsl/target/nested-typeof-conformance.tsv
    - name: Require bounded failure memo conformance evidence
      run: |
        test -s unlaxer-dsl/target/failure-memo-budget-java.tsv
        test -s unlaxer-dsl/target/failure-memo-budget-rust.log
        awk 'END {exit NR != 601}' unlaxer-dsl/target/failure-memo-budget-java.tsv
        awk '/^BUDGET/ {n++} END {exit n != 600}' unlaxer-dsl/target/failure-memo-budget-rust.log
    - name: Require bounded success memo conformance evidence
      run: |
        test -s unlaxer-dsl/target/success-memo-budget-java.tsv
        test -s unlaxer-dsl/target/success-memo-budget-rust.log
        awk 'END {exit NR != 601}' unlaxer-dsl/target/success-memo-budget-java.tsv
        awk '/^SUCCESS_BUDGET/ {n++} END {exit n != 600}' unlaxer-dsl/target/success-memo-budget-rust.log
    - name: Require nested leaf evaluator evidence
      run: |
        test -s unlaxer-dsl/target/nested-auto-eval-java.tsv
        test -s unlaxer-dsl/target/nested-auto-eval-rust.tsv
        awk 'END {exit NR != 265}' unlaxer-dsl/target/nested-auto-eval-java.tsv
        awk 'END {exit NR != 529}' unlaxer-dsl/target/nested-auto-eval-rust.tsv
    - name: Require finite memo scaling evidence
      run: |
        test -s unlaxer-dsl/target/memo-scaling-java.tsv
        test -s unlaxer-dsl/target/memo-scaling-rust.tsv
        awk 'END {exit NR != 9}' unlaxer-dsl/target/memo-scaling-java.tsv
        awk 'END {exit NR != 65}' unlaxer-dsl/target/memo-scaling-rust.tsv
    - name: Require pure success memo conformance evidence
      run: |
        test -s unlaxer-dsl/target/pure-success-memo-java.tsv
        test -s unlaxer-dsl/target/pure-success-memo-conformance.tsv
    - name: Require generated case-insensitive token conformance evidence
      run: |
        test -s unlaxer-dsl/target/case-insensitive-conformance.tsv
        test -s unlaxer-dsl/target/case-insensitive-java.tsv
    - name: Require snapshot cache conformance evidence
      run: test -s unlaxer-dsl/target/incremental-cache.tsv
    - name: Require real Java and Rust lifecycle evidence
      run: test -s unlaxer-dsl/target/classic-lsp-lifecycle.tsv
    - name: Require real Java and Rust semantic-token protocol evidence
      run: test -s unlaxer-dsl/target/classic-semantic-tokens.tsv
    - name: Require real Java and Rust syntax diagnostic evidence
      run: test -s unlaxer-dsl/target/classic-lsp-diagnostics.tsv
    - name: Require Java and native Rust literal enum evidence
      run: |
        test -s unlaxer-dsl/target/enum-java.tsv
        test -s unlaxer-dsl/target/enum-conformance.tsv
        test -s unlaxer-dsl/target/mixed-enum-java.tsv
        test -s unlaxer-dsl/target/mixed-enum-rust.tsv
    - name: Require recursive helper oracle evidence
      run: |
        test -s unlaxer-dsl/target/recursive-helpers-java.tsv
        test -s unlaxer-dsl/target/recursive-helpers-conformance.tsv
    - name: Require mapping-time typeof oracle evidence
      run: |
        test -s unlaxer-dsl/target/typeof-java.tsv
        test -s unlaxer-dsl/target/typeof-conformance.tsv
    - name: Require automatic evaluator oracle evidence
      run: |
        test -s unlaxer-dsl/target/evaluation-AutoEval-java.tsv
        test -s unlaxer-dsl/target/evaluation-AutoEval-rust.tsv
        test -s unlaxer-dsl/target/evaluation-ValueEval-java.tsv
        test -s unlaxer-dsl/target/evaluation-ValueEval-rust.tsv
    - name: Require real Java and Rust semantic-token protocol evidence
      run: test -s unlaxer-dsl/target/classic-semantic-tokens.tsv
    - name: Require real Java and Rust syntax diagnostic evidence
      run: test -s unlaxer-dsl/target/classic-lsp-diagnostics.tsv
    - name: Require REGEX retirement and lexical migration evidence
      run: |
        test -s unlaxer-dsl/target/regex-retirement-runtime.tsv
        test -s unlaxer-dsl/target/regex-retirement-rejections.tsv
    - name: Require real Java and Rust DAP protocol evidence
      run: |
        test -s unlaxer-dsl/target/classic-dap-protocol.tsv
        test -s unlaxer-dsl/target/classic-token-dap-protocol.tsv
        test -s unlaxer-dsl/target/token-trace.tsv
    - name: Resolver tutorial (Java and Rust)
      run: |
        python3 examples/resolver-tutorial/run.py build
        python3 examples/resolver-tutorial/run.py check
        cargo clippy --locked --manifest-path examples/resolver-tutorial/rust/Cargo.toml --all-targets -- -D warnings
        rustfmt --edition 2021 --config skip_children=true --check examples/resolver-tutorial/rust/src/main.rs examples/resolver-tutorial/rust/src/resolvers.rs
        test -s examples/resolver-tutorial/target/conformance.tsv
    - name: Generated WASM playground in Chromium
      working-directory: unlaxer-dsl/ubnf-vscode
      run: |
        npm ci
        npx playwright install chromium
        node scripts/contextual-lexing-reference.mjs
        node scripts/contextual-lexing-wasm.mjs
        node scripts/playground-browser.mjs
        node scripts/editor-playground-browser.mjs
        node --test scripts/completion.test.mjs
        node scripts/learning-browser.mjs
    - name: Require selectable lexing conformance and measurement evidence
      run: |
        test -s unlaxer-dsl/target/rust-token-stream.tsv
        awk -F '\t' 'NR > 1 {n[$5]++} END {exit NR != 1105 || n["generated"] != 552 || n["java-generated"] != 552}' unlaxer-dsl/target/rust-token-stream.tsv
        test -s unlaxer-dsl/target/token-stream-benchmark.tsv
        test -s unlaxer-dsl/target/rust-contextual-lexing.tsv
        test -s unlaxer-dsl/target/rust-contextual-lexing-invalid.tsv
        test -s unlaxer-dsl/target/rust-contextual-lexing-boundaries.tsv
        test -s unlaxer-dsl/ubnf-vscode/target/contextual-lexing-reference.tsv
        test -s unlaxer-dsl/ubnf-vscode/target/contextual-lexing-wasm.tsv
    - name: Require memo reset policy conformance evidence
      run: |
        test -s unlaxer-common/target/memo-reset-policy-java-failure.tsv
        test -s unlaxer-common/target/memo-reset-policy-java-success.tsv
        test -s unlaxer-common/target/memo-reset-policy-rust.log
    - name: Require semantic model and generated UBNF evidence
      run: |
        test -s unlaxer-dsl/target/rust-semantic-model.tsv
        test -s unlaxer-dsl/target/rust-semantic-rules.tsv
        test -s unlaxer-dsl/target/semantic-diagnostics.tsv
        test -s unlaxer-dsl/target/rust-preprocessing.tsv
        test -s unlaxer-dsl/target/rust-project-symbols.tsv
        test -s unlaxer-dsl/target/rust-type-relations.tsv
        test -s unlaxer-dsl/target/rust-call-inference.tsv
        test -s unlaxer-dsl/target/rust-semantic-queries.tsv
        test -s unlaxer-dsl/target/rust-semantic-query-edits.tsv
        test -s unlaxer-dsl/target/java-query-retention-metrics.tsv
        test -s unlaxer-dsl/target/rust-query-retention-metrics.tsv
        test -s unlaxer-dsl/target/rust-semantic-ubnf.tsv
        test -s unlaxer-dsl/target/rust-editor-pipeline.tsv
        test -s unlaxer-dsl/ubnf-vscode/target/editor-playground.tsv
    - name: Require UBNF source position conformance evidence
      run: test -s unlaxer-dsl/target/rust-ubnf-source.tsv
    - name: Require portability check conformance evidence
      run: test -s unlaxer-dsl/target/rust-portability.tsv
    - name: Require token adapter diagnostics and runtime evidence
      run: |
        test -s unlaxer-dsl/target/rust-token-adapter-diagnostics.tsv
        test -s unlaxer-dsl/target/rust-token-adapter-runtime.tsv
        test -s unlaxer-dsl/target/rust-parse-bindings.tsv
    - name: Require declarative token codegen and runtime evidence
      run: test -s unlaxer-dsl/target/rust-declarative-token-runtime.tsv
    - name: Require API evolution reports and real compiler evidence
      run: |
        test -s unlaxer-dsl/target/api-impact-conformance.tsv
        test -s unlaxer-dsl/target/api-impact-compile.tsv
    - name: Require rule trivia conformance evidence
      run: |
        test -s unlaxer-dsl/target/rust-rule-trivia.tsv
        test -s unlaxer-dsl/target/rust-unique-longest.tsv
        test -s unlaxer-dsl/target/rust-name-snapshots.tsv
        test -s unlaxer-dsl/target/rust-name-predicate.tsv
    - name: Require pinned package conformance evidence
      run: |
        test -s unlaxer-dsl/target/rust-packages.tsv
        test -s unlaxer-dsl/target/rust-package-https.tsv
        test -s unlaxer-dsl/target/rust-vocabulary-origins.tsv
    - name: Require transactional scope conformance evidence
      run: test -s unlaxer-dsl/target/rust-scope-store.tsv
    - name: Require generated scope annotation conformance evidence
      run: test -s unlaxer-dsl/target/rust-scope-annotations.tsv
    - name: Require typed nested capture conformance evidence
      run: test -s unlaxer-dsl/target/typed-nested-captures.tsv
    - name: Require nested separated capture conformance evidence
      run: |
        test -s unlaxer-dsl/target/nested-separated-captures.tsv
        test -s unlaxer-dsl/target/nested-separated-mapped.tsv
    - name: Require nested capture conformance evidence
      run: test -s unlaxer-dsl/target/rust-nested-captures.tsv
    - name: Require catalog metadata conformance evidence
      run: test -s unlaxer-dsl/target/rust-catalog-metadata.tsv
    - name: Require skip projection conformance evidence
      run: test -s unlaxer-dsl/target/rust-skip-mapping.tsv
    - name: Require capture equality conformance evidence
      run: test -s unlaxer-dsl/target/rust-capture-equality.tsv
    - name: Require ERROR element conformance evidence
      run: test -s unlaxer-dsl/target/rust-error-elements.tsv
    - name: Require recovery conformance evidence
      run: test -s unlaxer-dsl/target/rust-recovery.tsv
    - uses: actions/upload-artifact@v4
      with:
        name: rust-conformance
        path: |
          unlaxer-dsl/target/failure-memo-budget-java.tsv
          unlaxer-dsl/target/failure-memo-budget-rust.log
          unlaxer-dsl/target/success-memo-budget-java.tsv
          unlaxer-dsl/target/success-memo-budget-rust.log
          unlaxer-dsl/target/memo-scaling-java.tsv
          unlaxer-dsl/target/memo-scaling-rust.tsv
          unlaxer-dsl/target/nested-auto-eval-java.tsv
          unlaxer-dsl/target/nested-auto-eval-rust.tsv
          unlaxer-dsl/target/classic-lsp-lifecycle.tsv
          unlaxer-dsl/target/incremental-cache.tsv
          unlaxer-dsl/target/classic-semantic-tokens.tsv
          unlaxer-dsl/target/classic-lsp-diagnostics.tsv
          unlaxer-dsl/target/case-insensitive-conformance.tsv
          unlaxer-dsl/target/case-insensitive-java.tsv
          unlaxer-dsl/target/enum-java.tsv
          unlaxer-dsl/target/enum-conformance.tsv
          unlaxer-dsl/target/mixed-enum-java.tsv
          unlaxer-dsl/target/mixed-enum-rust.tsv
          unlaxer-dsl/target/recursive-helpers-java.tsv
          unlaxer-dsl/target/recursive-helpers-conformance.tsv
          unlaxer-dsl/target/typeof-java.tsv
          unlaxer-dsl/target/typeof-conformance.tsv
          unlaxer-dsl/target/evaluation-AutoEval-java.tsv
          unlaxer-dsl/target/evaluation-AutoEval-rust.tsv
          unlaxer-dsl/target/evaluation-ValueEval-java.tsv
          unlaxer-dsl/target/evaluation-ValueEval-rust.tsv
          unlaxer-dsl/target/rust-token-stream.tsv
          unlaxer-dsl/target/token-stream-benchmark.tsv
          unlaxer-dsl/target/rust-contextual-lexing.tsv
          unlaxer-dsl/target/rust-contextual-lexing-invalid.tsv
          unlaxer-dsl/target/rust-contextual-lexing-boundaries.tsv
          unlaxer-dsl/ubnf-vscode/target/contextual-lexing-reference.tsv
          unlaxer-dsl/ubnf-vscode/target/contextual-lexing-wasm.tsv
          unlaxer-dsl/target/rust-semantic-model.tsv
          unlaxer-dsl/target/rust-semantic-rules.tsv
          unlaxer-dsl/target/semantic-diagnostics.tsv
          unlaxer-dsl/target/rust-preprocessing.tsv
          unlaxer-dsl/target/rust-project-symbols.tsv
          unlaxer-dsl/target/rust-type-relations.tsv
          unlaxer-dsl/target/rust-call-inference.tsv
          unlaxer-dsl/target/rust-semantic-queries.tsv
          unlaxer-dsl/target/rust-semantic-query-edits.tsv
          unlaxer-dsl/target/java-query-retention-metrics.tsv
          unlaxer-dsl/target/rust-query-retention-metrics.tsv
          unlaxer-dsl/target/rust-semantic-ubnf.tsv
          unlaxer-dsl/target/rust-editor-pipeline.tsv
          unlaxer-dsl/ubnf-vscode/target/editor-playground.tsv
          unlaxer-dsl/target/rust-conformance.tsv
          unlaxer-dsl/target/rust-diagnostics.tsv
          unlaxer-dsl/target/rust-diagnostics-edge.tsv
          unlaxer-dsl/target/rust-cardinality.tsv
          unlaxer-dsl/target/rust-primitives.tsv
          unlaxer-dsl/target/rust-lexical.tsv
          unlaxer-dsl/target/rust-ubnf-frontend.tsv
          unlaxer-dsl/target/rust-ubnf-source.tsv
