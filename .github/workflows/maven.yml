name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  rust:
    name: Rust backend and Java conformance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Set up Rust (minimum supported version)
      run: |
        rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
        rustup default 1.85.0
    - name: Rust standalone checks
      run: |
        cargo fmt --all --manifest-path rust/Cargo.toml --check
        cargo test --locked --manifest-path rust/Cargo.toml
        cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
    - name: Cross-language fixtures, compile failures, and generated-file drift
      run: >
        mvn -B -pl unlaxer-common,unlaxer-dsl -am test
        -Dtest=RustBackendTest,RustConformanceTest,RustUbnfFrontendConformanceTest,NumericCaptureRuntimeTest,RustNativeEmitterTest,RustNativeGeneratorTest,RuleTriviaConformanceTest,ScopeStoreConformanceTest -DrustConformance=true
        -Dsurefire.failIfNoSpecifiedTests=false
    - name: Require rule trivia conformance evidence
      run: test -s unlaxer-dsl/target/rust-rule-trivia.tsv
    - name: Require transactional scope conformance evidence
      run: test -s unlaxer-dsl/target/rust-scope-store.tsv
    - uses: actions/upload-artifact@v4
      with:
        name: rust-conformance
        path: |
          unlaxer-dsl/target/rust-conformance.tsv
          unlaxer-dsl/target/rust-diagnostics.tsv
          unlaxer-dsl/target/rust-diagnostics-edge.tsv
          unlaxer-dsl/target/rust-cardinality.tsv
          unlaxer-dsl/target/rust-primitives.tsv
          unlaxer-dsl/target/rust-lexical.tsv
          unlaxer-dsl/target/rust-ubnf-frontend.tsv
          unlaxer-dsl/target/rust-associative.tsv
          unlaxer-dsl/target/rust-right-associative.tsv
          unlaxer-dsl/target/rust-mixed-values.tsv
          unlaxer-dsl/target/rust-delimited-mixed-values.tsv
          unlaxer-dsl/target/rust-shared-mixed-values.tsv
          unlaxer-dsl/target/semantic-cardinality-java.tsv
          unlaxer-dsl/target/semantic-cardinality-rust.tsv
          unlaxer-dsl/target/semantic-cardinality-both.tsv
          unlaxer-dsl/target/rust-native-generator.tsv
          unlaxer-dsl/target/rust-rule-trivia.tsv
          unlaxer-dsl/target/rust-scope-store.tsv
        if-no-files-found: error
    - name: Build and smoke-test the native subset example
      run: |
        cargo build --release --locked --manifest-path rust/Cargo.toml -p unlaxer-evolution-example
        printf '%s\n' 'if(0,neg(2*3),4+5)' | rust/target/release/unlaxer-evolution-example | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["value"] == 9'
        tar -czf rust/target/unlaxer-evolution-linux-x86_64.tar.gz -C rust/target/release unlaxer-evolution-example
    - name: Build and smoke-test the JVM-free generator
      run: |
        cargo build --release --locked --manifest-path rust/Cargo.toml -p unlaxer-generator
        PATH='' JAVA_HOME=/nonexistent-java rust/target/release/unlaxer generate --grammar unlaxer-dsl/src/test/resources/evolution/3/Evolution.ubnf --output rust/examples/evolution/src/generated --check
        tar -czf rust/target/unlaxer-generator-linux-x86_64.tar.gz -C rust/target/release unlaxer
    - uses: actions/upload-artifact@v4
      with:
        name: unlaxer-generator-linux-x86_64
        path: rust/target/unlaxer-generator-linux-x86_64.tar.gz
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: unlaxer-evolution-linux-x86_64
        path: rust/target/unlaxer-evolution-linux-x86_64.tar.gz
        if-no-files-found: error

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Validate Central release guard
      run: |
        python3 scripts/tests/test_central_release_guard.py
        python3 scripts/tests/test_version_sync.py
        bash -n scripts/release-central.sh
        
    - name: Build with Maven
      run: mvn -B clean test

    # 静的解析 (issue #37): Error Prone (compile 時) + SpotBugs。
    # 生成コードは除外 (config/spotbugs-exclude.xml / -XepExcludedPaths)。
    - name: Static analysis (Error Prone + SpotBugs)
      run: >
        mvn -B -Pstatic-analysis -pl unlaxer-common,unlaxer-dsl
        clean test-compile
        com.github.spotbugs:spotbugs-maven-plugin:4.10.2.0:check

  # UBNF VSIX を成果物として添付する。タグ push 時の Release 添付は
  # release-vsix.yml を参照。
  vsix:
    name: UBNF VSIX (ubnf-vscode)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js (for vsce)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install unlaxer to local repo
      run: mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true

    - name: Build ubnf-vscode VSIX
      run: mvn -B -pl unlaxer-dsl/ubnf-vscode verify -Dgpg.skip=true

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: ubnf-lsp-vsix
        path: unlaxer-dsl/ubnf-vscode/target/*.vsix
        if-no-files-found: error

  # downstream 検証: 3.0.3 の @scopeTree リグレッションは unlaxer 自身の
  # テストでは検出されず tinyexpression の LSP smoke で発覚した (#38)。
  # ビルド中の unlaxer に対して downstream の smoke を回し、再発を防ぐ。
  downstream:
    name: Downstream smoke (tinyexpression)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: unlaxer-parser

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install unlaxer to local repo
      working-directory: unlaxer-parser
      run: mvn -B -pl .,unlaxer-common,unlaxer-dsl install -DskipTests -Dgpg.skip=true

    - name: Resolve unlaxer version under test
      id: unlaxer
      working-directory: unlaxer-parser
      run: echo "version=$(mvn -q help:evaluate -Dexpression=revision -DforceStdout)" >> "$GITHUB_OUTPUT"

    - name: Checkout tinyexpression
      uses: actions/checkout@v4
      with:
        repository: opaopa6969/tinyexpression
        # Consumer migration and real token oracle; update deliberately with their contracts.
        ref: 854c1f4a7be07eed8007ce90541a0996ee2c93aa
        path: tinyexpression

    - name: Point tinyexpression at the unlaxer under test
      working-directory: tinyexpression
      run: >
        mvn -B versions:use-dep-version
        -Dincludes='org.unlaxer:unlaxer-common,org.unlaxer:unlaxer-dsl'
        -DdepVersion='${{ steps.unlaxer.outputs.version }}'
        -DforceVersion=true -DgenerateBackupPoms=false

    - name: tinyexpression p4-smoke
      working-directory: tinyexpression
      run: mvn -B -P p4-smoke test -Dgpg.skip=true

    - name: tinyexpression generated Node alias contract
      working-directory: tinyexpression
      run: >
        mvn -B test -Dgpg.skip=true
        -Dtinyexpression.expected.mapper.snapshot=true
        -Dtinyexpression.expected.mapper.nodeAlias=true
        -Dtest=P4SourceMappingTest,P4OwnedSliceSourceTest

    - name: Install tinyexpression (for LSP smoke)
      working-directory: tinyexpression
      run: mvn -B install -DskipTests -Dgpg.skip=true

    - name: Set up Rust for actual tinyexpression token conformance
      run: |
        rustup toolchain install 1.85.0 --profile minimal
        rustup default 1.85.0

    - name: Compare real tinyexpression external tokens with both Rust generators
      working-directory: unlaxer-parser
      run: |
        mvn -B -pl unlaxer-dsl test -Dtest=TinyStringTokenConformanceTest,TinyCodeFenceConformanceTest -DrustConformance=true \
          -Dtinyexpression.classes="$GITHUB_WORKSPACE/tinyexpression/target/classes"
        test -s unlaxer-dsl/target/rust-tiny-string.tsv
        test -s unlaxer-dsl/target/rust-tiny-code-fence.tsv

    - uses: actions/upload-artifact@v4
      with:
        name: tiny-string-token-conformance
        path: unlaxer-parser/unlaxer-dsl/target/rust-tiny-string.tsv
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: tiny-code-fence-conformance
        path: unlaxer-parser/unlaxer-dsl/target/rust-tiny-code-fence.tsv
        if-no-files-found: error

    # 3.0.3 リグレッションを実際に検出したのはこの LSP smoke
    - name: tinyexpression LSP smoke
      working-directory: tinyexpression/tools/tinyexpression-p4-lsp-vscode
      env:
        MAVEN_OPTS: >-
          --add-opens=java.base/java.util=ALL-UNNAMED
          --add-opens=java.base/java.lang=ALL-UNNAMED
      run: >
        mvn -B versions:use-dep-version
        -Dincludes='org.unlaxer:unlaxer-dsl'
        -DdepVersion='${{ steps.unlaxer.outputs.version }}'
        -DforceVersion=true -DgenerateBackupPoms=false
        && mvn -B -P p4-smoke test -Dgpg.skip=true
