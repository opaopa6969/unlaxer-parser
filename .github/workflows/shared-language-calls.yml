name: shared-language-calls
on:
  push:
    branches: [master]
  pull_request:
jobs:
  shared-language-calls:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          overwrite-settings: false
      - name: Rust toolchain を既定を変更せずに準備
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=SharedLanguageCallConformanceTest,RustUbnfFrontendConformanceTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
        env:
          CARGO_INCREMENTAL: '0'
      - run: test -s unlaxer-dsl/target/shared-language-calls.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: shared-language-calls
          path: unlaxer-dsl/target/shared-language-calls.tsv
          if-no-files-found: error
