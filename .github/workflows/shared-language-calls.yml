name: shared-language-calls
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shared-language-calls:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - name: Select job temporary directory (#1045)
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          MAVEN_OPTS: -Djava.io.tmpdir=${{ runner.temp }} -Dunlaxer.test.tmpdir=${{ runner.temp }} -DadditionalJOption=-J-Djava.io.tmpdir=${{ runner.temp }}
        run: |
          printf '%s\n' "TMPDIR=$TMPDIR" "TMP=$TMP" "TEMP=$TEMP" "MAVEN_OPTS=$MAVEN_OPTS" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.9'
          overwrite-settings: false
      - uses: ./.github/actions/maven-job-repository
      - name: Rust toolchain を既定を変更せずに準備
        run: bash "$GITHUB_WORKSPACE/scripts/ci/retry-network.sh" rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy --no-self-update
      - name: Prepare required tests (shared-language-calls)
        run: python3 scripts/verify-optin-tests.py shared-language-calls --prepare
      - run: mvn -B -pl unlaxer-common,unlaxer-dsl -am test -Dtest=SharedLanguageCallConformanceTest,RustUbnfFrontendConformanceTest -DrustConformance=true -Dsurefire.failIfNoSpecifiedTests=false
        env:
          CARGO_INCREMENTAL: '0'
      - name: Verify required tests (shared-language-calls)
        id: verify-shared-language-calls
        if: success()
        run: python3 scripts/verify-optin-tests.py shared-language-calls
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.verify-shared-language-calls.outcome != 'skipped' }}
        with:
          name: optin-shared-language-calls
          path: |
            target/optin-evidence/shared-language-calls/
          if-no-files-found: error
      - run: test -s unlaxer-dsl/target/shared-language-calls.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: shared-language-calls
          path: unlaxer-dsl/target/shared-language-calls.tsv
          if-no-files-found: error
