name: source-maps
on:
  push:
    branches: [master]
  pull_request:
jobs:
  source-maps:
    runs-on: [unlaxer-parser-ci, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/generate-grapheme-tables.py --check
      - run: mvn -B -pl unlaxer-common -am test -Dtest=SourceMapsTest,PositionResolverBoundaryTest,DocumentSnapshotInverseTest,GraphemeTest -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --locked --manifest-path rust/Cargo.toml -p unlaxer-runtime --test source_maps --test source_inverse_positions --test grapheme
