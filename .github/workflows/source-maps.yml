name: source-maps
on:
  push:
    branches: [master]
  pull_request:
jobs:
  source-maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - run: mvn -B -pl unlaxer-common -am test -Dtest=SourceMapsTest -Dsurefire.failIfNoSpecifiedTests=false
      - run: cargo test --manifest-path rust/Cargo.toml -p unlaxer-runtime --test source_maps
