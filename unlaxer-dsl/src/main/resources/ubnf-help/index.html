<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:;">
  <title>UBNF · 文法をつくる</title>
  <link rel="stylesheet" href="help.css">
</head>
<body>
  <header><span class="brand">UBNF <span class="badge">v2</span></span><span>文法をつくるための道具箱</span></header>
  <main>
    <section class="intro" aria-labelledby="title">
      <p class="eyebrow">読む → 書く → 試す</p>
      <h1 id="title">はじめての文法を、ここから。</h1>
      <p id="intro">catalog を読み込んでいます…</p>
      <ol id="workflow" class="workflow"></ol>
      <p class="notice">この画面は文法を書く人向けのヘルプです。生成した言語を使う人向けの説明は、文法の <code>@doc</code> から表示します。利用者に試してほしい入力例も <code>@doc</code> に書きましょう。</p>
      <button type="button" id="generate" class="primary" hidden>保存した文法の Playground を生成して開く</button>
      <details><summary>Playground の環境準備・操作手順</summary><div id="setup"></div></details>
    </section>
    <nav aria-label="ヘルプのページ" class="tabs">
      <button type="button" data-tab="learn" aria-pressed="true">はじめの一歩</button>
      <button type="button" data-tab="reference" aria-pressed="false">構文 catalog</button>
      <button type="button" data-tab="troubleshoot" aria-pressed="false">困ったとき</button>
    </nav>
    <section id="learn" class="page">
      <div class="lesson-layout"><nav id="lessons" aria-label="レッスン"></nav><article id="lesson"></article></div>
    </section>
    <section id="reference" class="page" hidden>
      <label for="search">やりたいこと・構文を検索</label>
      <input id="search" type="search" placeholder="例: 数字、繰り返し、import、空白" autocomplete="off">
      <p id="count" role="status"></p>
      <div id="entries" class="cards"></div>
    </section>
    <section id="troubleshoot" class="page" hidden><h2>症状から探す</h2><div id="errors" class="cards"></div></section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer>認識の仕様を UBNF に。実装は文法から生成します。掲載サンプルは Java / Rust の共通テストで検証しています。</footer>
  <script src="help.js"></script>
</body>
</html>
